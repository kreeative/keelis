<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fcfaf4" media="(prefers-color-scheme: light)" />
    <!-- These must match the *top of the page*, which is the home canvas — not the page
         background. The canvas follows the theme now, so #fcfaf4 / #21170d are its two
         measured values — --surface in light, --card-surface in dark — and the browser's
         own bar stops showing a seam above the app. Recompute them if either token moves:
         a theme-color left behind from the previous palette is a grey strip over a warm
         page, which is exactly the seam these exist to remove. -->
    <meta name="theme-color" content="#21170d" media="(prefers-color-scheme: dark)" />
    <title>Keewal Meere</title>
    <!-- Poppins, self-hosted. Preload the two faces that paint first: body and bold. -->
    <link rel="preload" href="/fonts/poppins-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <script>
      /* Apply the stored theme before first paint, so a dark-theme user never sees a white
         page for a frame. It has to be inline and blocking to beat the paint — which is why
         the deployed Content-Security-Policy carries this script's sha256 rather than
         allowing inline script in general; `e2e/csp.mjs` recomputes that hash and fails if
         it has drifted. The `keelis.` fallback carries the theme across the rename. */
      try {
        /* Light unless told otherwise — the app's default is not the system's preference,
           so an unset key resolves to 'light' here exactly as it does in readTheme(). Only
           the explicit 'system' choice leaves the attribute off and lets the media query
           decide, which is why that choice is now stored rather than implied by absence. */
        var t = localStorage.getItem('keewal.theme') || localStorage.getItem('keelis.theme') || 'light';
        if (t === 'dark' || t === 'light') {
          document.documentElement.dataset.theme = t;
          /* The bar too, and for the same reason. Those two theme-color tags answer for the
             *system*, so an explicit choice against it paints the browser's own strip in the
             other theme — and doing it from React instead would flash that strip on every
             load. Copied from the meta that already holds the colour, never retyped. */
          var src = document.querySelector('meta[name="theme-color"][media*="' + t + '"]');
          var first = document.querySelector('meta[name="theme-color"]');
          if (src && first) {
            var m = document.createElement('meta');
            m.setAttribute('name', 'theme-color');
            m.setAttribute('data-override', '');
            m.setAttribute('content', src.getAttribute('content'));
            first.parentNode.insertBefore(m, first);
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
